# Contrôle anti-bot du Treasure, une fois par jour (8 h 07 heure de Paris en hiver) : résumé sur Telegram.
# Lecture seule : aucune transaction, aucune graine utilisée.
name: Controle anti-bot Treasure

on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyse des dernières 24 h
        env:
          TREASURE_CONTRACT: ${{ vars.TREASURE_CONTRACT }}
          RPC_URL: ${{ vars.RPC_URL || 'https://testnet.asentum.com' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node croupier/bot-check.mjs
