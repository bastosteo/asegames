# Croupiers d'ASE Loto, exécutés gratuitement par GitHub toutes les 10 minutes.
# Chaque passage : owner (fermeture, secret owner), collaborateur (secret collab),
# puis owner encore (comptage, tirage, paiements). S'il n'y a rien à faire, il s'arrête en ~20 s.
# Les secrets (graines) sont rangés dans Settings → Secrets and variables → Actions, jamais dans le code.
name: Croupiers ASE Loto

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: croupiers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  croupiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTRACT: ${{ vars.CONTRACT || 'ase1hcfm75h4wnwrxma6juwjw4tm8wzcwqs9saaqfr' }}
      RPC_URL: ${{ vars.RPC_URL || 'https://testnet.asentum.com' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENV_FILE: /nonexistent
      MAX_RUN_MS: '480000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: npm install --prefix croupier --no-audit --no-fund
      - name: Croupier owner
        env:
          ROLE: owner
          CROUPIER_NAME: croupier-owner-github
          SIGNER_SEED: ${{ secrets.OWNER_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.OWNER_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      - name: Croupier collaborateur
        if: ${{ !cancelled() }}
        env:
          ROLE: collab
          CROUPIER_NAME: croupier-collab-github
          SIGNER_SEED: ${{ secrets.COLLAB_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.COLLAB_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      - name: Croupier owner (comptage et paiements)
        if: ${{ !cancelled() }}
        env:
          ROLE: owner
          CROUPIER_NAME: croupier-owner-github
          SIGNER_SEED: ${{ secrets.OWNER_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.OWNER_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      # ---- ASE Raffle (tombola), une fois installée (variable RAFFLE_CONTRACT) ----
      - name: Tombola owner
        if: ${{ !cancelled() && vars.RAFFLE_CONTRACT != '' }}
        env:
          ROLE: owner
          CROUPIER_NAME: tombola-owner-github
          CONTRACT: ${{ vars.RAFFLE_CONTRACT }}
          SIGNER_SEED: ${{ secrets.OWNER_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.RAFFLE_OWNER_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      - name: Tombola collaborateur
        if: ${{ !cancelled() && vars.RAFFLE_CONTRACT != '' }}
        env:
          ROLE: collab
          CROUPIER_NAME: tombola-collab-github
          CONTRACT: ${{ vars.RAFFLE_CONTRACT }}
          SIGNER_SEED: ${{ secrets.COLLAB_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.RAFFLE_COLLAB_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      # ---- ASE Treasure : ouvre les grilles, envoie la preuve du trésor, rembourse ----
      # (les réponses aux fouilles, elles, sont données tout de suite par le site : /api/treasure)
      - name: Treasure
        if: ${{ !cancelled() && vars.TREASURE_CONTRACT != '' }}
        env:
          ROLE: owner
          GAME: treasure
          CROUPIER_NAME: treasure-github
          CONTRACT: ${{ vars.TREASURE_CONTRACT }}
          SIGNER_SEED: ${{ secrets.OWNER_SIGNER_SEED }}
          TREASURE_SEED: ${{ secrets.TREASURE_SEED }}
        run: node croupier/croupier.mjs once
      # ---- ASE Airdrop (tirage hebdomadaire des frais), une fois installé (variable AIRDROP_CONTRACT) ----
      - name: Airdrop owner (liste + secret owner)
        if: ${{ !cancelled() && vars.AIRDROP_CONTRACT != '' }}
        env:
          ROLE: owner
          GAME: airdrop
          CROUPIER_NAME: airdrop-owner-github
          CONTRACT: ${{ vars.AIRDROP_CONTRACT }}
          LOTO_CONTRACT: ${{ vars.CONTRACT }}
          RAFFLE_CONTRACT: ${{ vars.RAFFLE_CONTRACT }}
          TREASURE_CONTRACT: ${{ vars.TREASURE_CONTRACT }}
          SIGNER_SEED: ${{ secrets.OWNER_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.AIRDROP_OWNER_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
      - name: Airdrop collaborateur
        if: ${{ !cancelled() && vars.AIRDROP_CONTRACT != '' }}
        env:
          ROLE: collab
          GAME: airdrop
          CROUPIER_NAME: airdrop-collab-github
          CONTRACT: ${{ vars.AIRDROP_CONTRACT }}
          LOTO_CONTRACT: ${{ vars.CONTRACT }}
          RAFFLE_CONTRACT: ${{ vars.RAFFLE_CONTRACT }}
          TREASURE_CONTRACT: ${{ vars.TREASURE_CONTRACT }}
          SIGNER_SEED: ${{ secrets.COLLAB_SIGNER_SEED }}
          CHAIN_SEED: ${{ secrets.AIRDROP_COLLAB_CHAIN_SEED }}
        run: node croupier/croupier.mjs once
