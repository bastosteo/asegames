# Croupiers de l'HIPPODROME v3 du site de test (asevegas-test.pages.dev), toutes les 10 minutes.
# Deux contrats : ÉCURIE (chevaux des joueurs) et PARIS (spectateurs). Une course par jour (19 h Paris).
# Chaque étape : pose l'heure, dépose les enveloppes (1 h avant), révèle les graines (après le départ).
# S'il n'y a rien à faire, chaque étape s'arrête en quelques secondes.
# Secrets : TEST_HIPPO_A_SIGNER, TEST_HIPPO_B_SIGNER, TEST_HIPPO_A_SEED, TEST_HIPPO_B_SEED.
# Variables : TEST_HIPPO3_ECURIE, TEST_HIPPO3_PARIS.
name: Hippodrome TEST

on:
  schedule:
    - cron: '1-59/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hippodrome-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  croupiers:
    if: ${{ vars.TEST_HIPPO3_ECURIE != '' && vars.TEST_HIPPO3_PARIS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ECURIE: ${{ vars.TEST_HIPPO3_ECURIE }}
      PARIS: ${{ vars.TEST_HIPPO3_PARIS }}
      RPC_URL: ${{ vars.RPC_URL || 'https://testnet.asentum.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: npm install --prefix croupier --no-audit --no-fund
      - name: Croupier A
        env: { ROLE: A, SIGNER_SEED: '${{ secrets.TEST_HIPPO_A_SIGNER }}', HIPPO_SEED: '${{ secrets.TEST_HIPPO_A_SEED }}' }
        run: node croupier/hippodrome3.mjs once
      - name: Croupier B
        if: ${{ !cancelled() }}
        env: { ROLE: B, SIGNER_SEED: '${{ secrets.TEST_HIPPO_B_SIGNER }}', HIPPO_SEED: '${{ secrets.TEST_HIPPO_B_SEED }}' }
        run: node croupier/hippodrome3.mjs once
      - name: Croupier A (2e passage)
        if: ${{ !cancelled() }}
        env: { ROLE: A, SIGNER_SEED: '${{ secrets.TEST_HIPPO_A_SIGNER }}', HIPPO_SEED: '${{ secrets.TEST_HIPPO_A_SEED }}' }
        run: node croupier/hippodrome3.mjs once
      - name: Croupier B (2e passage)
        if: ${{ !cancelled() }}
        env: { ROLE: B, SIGNER_SEED: '${{ secrets.TEST_HIPPO_B_SIGNER }}', HIPPO_SEED: '${{ secrets.TEST_HIPPO_B_SEED }}' }
        run: node croupier/hippodrome3.mjs once
